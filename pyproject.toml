[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudaudit"
version = "0.1.0"
description = "AWS security posture scanner and detection lab"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akarshika Tripathi" }]
dependencies = ["boto3>=1.34"]

[project.scripts]
cloudaudit = "cloudaudit.cli:main"

[tool.setuptools.packages.find]
include = ["cloudaudit*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
